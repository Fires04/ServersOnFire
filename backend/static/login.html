<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ServersOnFire — sign in</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="stylesheet" href="/static/style.css?v=2">
</head>
<body class="login-body">
  <form class="login-card" method="post" action="/login">
    <h1><img src="/logo.png" alt="" class="logo"> ServersOnFire</h1>
    <p class="subtitle">Inventory, Topology &amp; Services</p>
    <div id="login-error" class="error-box" hidden>Incorrect username or password.</div>
    <label>Username
      <input type="text" name="username" autocomplete="username" required autofocus>
    </label>
    <label>Password
      <input type="password" name="password" autocomplete="current-password" required>
    </label>
    <label class="checkbox-row">
      <input type="checkbox" name="remember" value="1">
      Stay signed in
    </label>
    <button type="submit">Sign in</button>
  </form>
  <script>
    if (new URLSearchParams(location.search).get('error')) {
      document.getElementById('login-error').hidden = false;
    }
  </script>
</body>
</html>
